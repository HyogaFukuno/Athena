<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" role="img" aria-label="試合の数ごとのサーバーのメモリ（anon）。JVM を分けた見積もりと、1 JVM にまとめた実測">
  <rect width="960" height="440" rx="10" fill="#fcfcfb"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0b0b0b">試合を増やしたときのメモリ（VPS-B の実測、サーバーの anon）</text>

  <!-- legend -->
  <g font-size="13" fill="#0b0b0b">
    <rect x="24" y="52" width="14" height="14" rx="3" fill="#eb6834"/><text x="44" y="64">前：試合ごとに JVM を分ける（1 試合 167 MiB × 試合数の見積もり）</text>
    <rect x="520" y="52" width="14" height="14" rx="3" fill="#2a78d6"/><text x="540" y="64">今：1 JVM にまとめる（実測）</text>
  </g>

  <!-- grid and axis: 0..2100 MiB over y 340..70 -->
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="90" y1="275.7" x2="920" y2="275.7"/>
    <line x1="90" y1="211.4" x2="920" y2="211.4"/>
    <line x1="90" y1="147.1" x2="920" y2="147.1"/>
    <line x1="90" y1="82.9" x2="920" y2="82.9"/>
  </g>
  <line x1="90" y1="340" x2="920" y2="340" stroke="#9a9993" stroke-width="1"/>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="82" y="344">0</text>
    <text x="82" y="279.7">500</text>
    <text x="82" y="215.4">1,000</text>
    <text x="82" y="151.1">1,500</text>
    <text x="82" y="86.9">2,000</text>
  </g>
  <text x="24" y="210" font-size="12" fill="#52514e" transform="rotate(-90 24 210)" text-anchor="middle">MiB</text>

  <!-- the box's memory -->
  <line x1="90" y1="216.6" x2="920" y2="216.6" stroke="#52514e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="96" y="210" font-size="12" fill="#52514e">VPS-B の箱全体のメモリ 960 MiB</text>

  <!-- bars: groups at 190, 397, 604, 811 -->
  <g>
    <rect x="132" y="318.5" width="56" height="21.5" rx="4" fill="#eb6834"/>
    <rect x="192" y="318.5" width="56" height="21.5" rx="4" fill="#2a78d6"/>
    <rect x="339" y="254.1" width="56" height="85.9" rx="4" fill="#eb6834"/>
    <rect x="399" y="308.1" width="56" height="31.9" rx="4" fill="#2a78d6"/>
    <rect x="546" y="168.2" width="56" height="171.8" rx="4" fill="#eb6834"/>
    <rect x="606" y="295.6" width="56" height="44.4" rx="4" fill="#2a78d6"/>
    <rect x="753" y="82.3" width="56" height="257.7" rx="4" fill="#eb6834"/>
    <rect x="813" y="286.1" width="56" height="53.9" rx="4" fill="#2a78d6"/>
  </g>
  <g font-size="12" fill="#0b0b0b" text-anchor="middle">
    <text x="160" y="312">167</text><text x="220" y="312">167</text>
    <text x="367" y="248">668</text><text x="427" y="302">248</text>
    <text x="574" y="162">1,336</text><text x="634" y="289">345</text>
    <text x="781" y="76">2,004</text><text x="841" y="280">419</text>
  </g>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="190" y="362">1 試合</text>
    <text x="397" y="362">4 試合</text>
    <text x="604" y="362">8 試合</text>
    <text x="811" y="362">12 試合</text>
  </g>
  <g font-size="12" fill="#52514e">
    <text x="24" y="398">実測は MatchSim（SG に似せた試合）で、1 JVM・ParallelGC・試合ごとのスレッドあり（2026-11-03）。本物の SG の 10 部屋は 406〜427 MiB。</text>
    <text x="24" y="418">JVM を分けた側は 1 試合の実測 167 MiB を試合数でかけた見積もり。1 試合足すごとの増え方は、分けると 167 MiB、まとめると約 23 MiB。</text>
  </g>
</svg>
